<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>login AMS2</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }
    hr {
        margin: 20px 0;
    }
    label {
        display: inline-block;
        width: 150px;
    }
    input {
        width: 200px;
        padding: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    button {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    button:hover {
        background-color: #c6c6c6;
    }
</style>
<body>
    <h1>Register</h1>
    <form action="">
        <label for="email">Correu electrònic:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="username">Nom d'usuari:</label>
        <input type="text" id="registerUsername" name="username" required>
        <br><br>
        <label for="password">Contrasenya:</label>
        <input type="password" id="registerPassword" name="password" required>
        <br><br>
        <label for="confirmpassword">Confirmar contrasenya:</label>
        <input type="password" id="confirmpassword" name="confirmpassword" required>
        <br><br>
        <button onclick="register()">Envia</button>
    </form>
    <hr>
    <h1>Login</h1>
    <form action="">
        <label for="username">Nom d'usuari:</label>
        <input type="text" id="loginUsername" name="username" required>
        <br><br>
        <label for="password">Contrasenya:</label>
        <input type="password" id="loginPassword" name="password" required>
        <br><br>
        <button onclick="login()">Envia</button>
    </form>
    <script>
        let userInfo = [
            {
            email: "example@gmail.com",
            username: "exampleUser",
            password: "3x4mpl3P4ssw0rd"
            }
        ];

        function register() {
            const email = document.getElementById('email').value;
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;
            const confirmpassword = document.getElementById('confirmpassword').value;

            if (password !== confirmpassword) {
                alert("Les contrasenyes no coincideixen.");
                return;
            }

            const newUser = {
                email: email,
                username: username,
                password: password
            };

            userInfo.push(newUser);
            console.log(userInfo);
            alert("Usuari registrat amb èxit!");
        }

        function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            let validUsername = false;
            for (let i = 0; i < userInfo.length; i++) {
                if (userInfo[i].username === username) {
                    validUsername = true;
                    break;
                }
            }
            if (!validUsername) {
                alert("Nom d'usuari incorrecte.");
                return;
            }

            let user = null;
            for (let i = 0; i < userInfo.length; i++) {
                if (userInfo[i].username === username && userInfo[i].password === password) {
                    user = userInfo[i];
                    break;
                }
            }
            if (user) {
                alert("Inici de sessió correcte!");
            } else {
                alert("Contrasenya incorrecta.");
            }
        }
    </script>
</body>
</html>
